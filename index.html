<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PO Status Dashboard</title>
<meta name="description" content="A live-updating purchase order status dashboard that flags at-risk and overdue POs before they become a problem." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;650&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10161d;
    --panel: #1a222c;
    --panel-light: #212b37;
    --panel-alt: #171f28;
    --border: #2b3542;
    --text-primary: #e7ecf2;
    --text-muted: #8b97a6;
    --text-faint: #5c6773;
    --steel: #5b8fb0;
    --steel-bright: #7fb0d1;
    --good: #4a9d5c;
    --good-bg: rgba(74,157,92,0.12);
    --risk: #d99a2b;
    --risk-bg: rgba(217,154,43,0.14);
    --overdue: #c8503f;
    --overdue-bg: rgba(200,80,63,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  }
  .mono { font-family: 'IBM Plex Mono', 'SF Mono', monospace; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.2px; display: flex; align-items: center; gap: 9px; }
  .header p { font-size: 12.5px; color: var(--text-faint); margin: 4px 0 0 29px; }
  .synced { font-size: 11px; color: var(--text-faint); }

  .kpi-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; flex: 1; min-width: 140px; }
  .kpi-label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); letter-spacing: 0.3px; text-transform: uppercase; }
  .kpi-value { font-size: 28px; font-weight: 600; }

  .controls { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; flex: 1 1 220px; }
  .search-box input { background: transparent; border: none; outline: none; color: var(--text-primary); font-family: inherit; font-size: 13px; width: 100%; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text-muted); font-size: 12.5px; font-weight: 550; cursor: pointer; }
  .pill.active { }
  .pill span.count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; opacity: 0.85; }

  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  .table-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .scroll-x { overflow-x: auto; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--border); background: var(--panel-light); cursor: pointer; user-select: none; }
  th.no-sort { cursor: default; }
  td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }
  tr.row-even { background: var(--panel); }
  tr.row-odd { background: var(--panel-alt); }

  .gauge-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
  .gauge-track { position: relative; height: 6px; border-radius: 3px; background: var(--panel-light); overflow: hidden; }
  .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.3s ease; }
  .gauge-marker { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--text-primary); opacity: 0.6; }
  .gauge-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }

  .legend { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-faint); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .empty-row td { padding: 28px 14px; text-align: center; color: var(--text-faint); font-size: 13px; }

  a.attrib { color: var(--text-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>🚚 PO Status Dashboard</h1>
      <p id="subhead"></p>
    </div>
    <div class="synced mono" id="synced"></div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input id="search" placeholder="Search PO #, supplier, or part..." />
    </div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="table-wrap">
    <div class="scroll-x">
      <table>
        <thead>
          <tr id="theadRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background: var(--overdue)"></span>Overdue — past due date, not yet received</div>
    <div class="legend-item"><span class="legend-dot" style="background: var(--risk)"></span>At Risk — due within 3 days</div>
    <div class="legend-item"><span class="legend-dot" style="background: var(--good)"></span>On Track — more than 3 days out</div>
  </div>
</div>

<script>
// ---- Sample PO data (offsets are relative to today, so the demo always looks live) ----
const RAW = [
  { po: 'PO-40217', supplier: 'Nordic Bearing Co.', part: 'SKF 6205-2RS Bearing (x200)', orderOffset: -21, dueOffset: -4, value: 3200 },
  { po: 'PO-40219', supplier: 'ServoTech Industrial', part: 'AC Servo Motor, 750W', orderOffset: -18, dueOffset: -1, value: 8450 },
  { po: 'PO-40222', supplier: 'Allen-Bradley Direct', part: 'PLC Module 1756-IB16', orderOffset: -14, dueOffset: 2, value: 5120 },
  { po: 'PO-40225', supplier: 'Conveyor Systems Ltd.', part: 'Modular Belt, 24in x 40ft', orderOffset: -10, dueOffset: 1, value: 2760 },
  { po: 'PO-40228', supplier: 'Precision Fasteners Inc.', part: 'M8 Hex Bolt Assortment', orderOffset: -9, dueOffset: 6, value: 410 },
  { po: 'PO-40231', supplier: 'Optex Sensors', part: 'Photoelectric Sensor E3Z', orderOffset: -8, dueOffset: 0, value: 1180 },
  { po: 'PO-40233', supplier: 'Nordic Bearing Co.', part: 'SKF 22218 Spherical Roller Bearing', orderOffset: -7, dueOffset: 9, value: 2950 },
  { po: 'PO-40236', supplier: 'HydraFlow Components', part: 'Hydraulic Cylinder, 2in Bore', orderOffset: -6, dueOffset: 3, value: 4300 },
  { po: 'PO-40238', supplier: 'ServoTech Industrial', part: 'Servo Drive Amplifier', orderOffset: -5, dueOffset: 11, value: 6700 },
  { po: 'PO-40241', supplier: 'Grainger Industrial', part: 'V-Belt Set, A-Section', orderOffset: -4, dueOffset: 14, value: 340 },
  { po: 'PO-40243', supplier: 'Allen-Bradley Direct', part: 'HMI PanelView 800', orderOffset: -3, dueOffset: -2, value: 3890 },
  { po: 'PO-40245', supplier: 'Vacuum Dynamics', part: 'Vacuum Generator, Venturi', orderOffset: -2, dueOffset: 17, value: 1560 },
  { po: 'PO-40247', supplier: 'Optex Sensors', part: 'Laser Distance Sensor', orderOffset: -20, dueOffset: -8, value: 2100 },
  { po: 'PO-40249', supplier: 'Conveyor Systems Ltd.', part: 'Roller Chain, #60', orderOffset: -1, dueOffset: 19, value: 890 },
  { po: 'PO-40252', supplier: 'Precision Fasteners Inc.', part: 'Shoulder Bolt Kit', orderOffset: -12, dueOffset: -6, value: 275 },
  { po: 'PO-40255', supplier: 'HydraFlow Components', part: 'Hydraulic Pump, Gear Type', orderOffset: -6, dueOffset: 22, value: 5340 },
  { po: 'PO-40257', supplier: 'Grainger Industrial', part: 'Electric Motor, 5HP TEFC', orderOffset: -15, dueOffset: 4, value: 1970 },
  { po: 'PO-40260', supplier: 'Vacuum Dynamics', part: 'Vacuum Cup, Bellows 40mm', orderOffset: -3, dueOffset: 26, value: 195 },
];

function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); return d; }
function fmt(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

const POS = RAW.map(r => {
  const orderDate = daysFromNow(r.orderOffset);
  const dueDate = daysFromNow(r.dueOffset);
  const daysToDue = r.dueOffset;
  const totalWindow = r.dueOffset - r.orderOffset;
  const elapsed = -r.orderOffset;
  let status = daysToDue < 0 ? 'overdue' : daysToDue <= 3 ? 'at-risk' : 'on-track';
  return { ...r, orderDate, dueDate, daysToDue, totalWindow, elapsed, status };
});

const STATUS_META = {
  'overdue': { label: 'Overdue', color: 'var(--overdue)', hex: '#c8503f' },
  'at-risk': { label: 'At Risk', color: 'var(--risk)', hex: '#d99a2b' },
  'on-track': { label: 'On Track', color: 'var(--good)', hex: '#4a9d5c' },
};

let state = { query: '', statusFilter: 'all', sortKey: 'daysToDue', sortDir: 'asc' };

document.getElementById('subhead').textContent = `${POS.length} open purchase orders · sample data, refreshes against your ERP feed in production`;
document.getElementById('synced').textContent = `Last synced: ${fmt(new Date())}`;

function computeCounts() {
  return POS.reduce((acc, p) => { acc[p.status]++; acc.value += p.value; return acc; }, { overdue: 0, 'at-risk': 0, 'on-track': 0, value: 0 });
}

function renderKPIs() {
  const c = computeCounts();
  const cards = [
    { label: 'Overdue', value: c.overdue, color: 'var(--overdue)' },
    { label: 'At Risk (≤3d)', value: c['at-risk'], color: 'var(--risk)' },
    { label: 'On Track', value: c['on-track'], color: 'var(--good)' },
    { label: 'Open PO Value', value: `$${(c.value/1000).toFixed(1)}k`, color: 'var(--steel-bright)' },
  ];
  document.getElementById('kpiRow').innerHTML = cards.map(k => `
    <div class="kpi-card">
      <div class="kpi-label" style="color:${k.color}">${k.label}</div>
      <div class="kpi-value mono">${k.value}</div>
    </div>`).join('');
}

function renderPills() {
  const c = computeCounts();
  const pills = [
    { key: 'all', label: 'All POs', count: POS.length, hex: '#5b8fb0' },
    { key: 'overdue', label: 'Overdue', count: c.overdue, hex: '#c8503f' },
    { key: 'at-risk', label: 'At Risk', count: c['at-risk'], hex: '#d99a2b' },
    { key: 'on-track', label: 'On Track', count: c['on-track'], hex: '#4a9d5c' },
  ];
  document.getElementById('pills').innerHTML = pills.map(p => {
    const active = state.statusFilter === p.key;
    return `<button class="pill" data-key="${p.key}" style="${active ? `border-color:${p.hex};background:${p.hex}22;color:${p.hex}` : ''}">${p.label} <span class="count">${p.count}</span></button>`;
  }).join('');
  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => { state.statusFilter = btn.dataset.key; renderAll(); });
  });
}

const COLS = [
  { key: 'po', label: 'PO #', sortable: true },
  { key: 'supplier', label: 'Supplier', sortable: true },
  { key: 'part', label: 'Part / Description', sortable: false },
  { key: 'dueDate', label: 'Due Date', sortable: true },
  { key: 'daysToDue', label: 'Status Gauge', sortable: true },
  { key: 'value', label: 'Value', sortable: true },
];

function renderHead() {
  document.getElementById('theadRow').innerHTML = COLS.map(c => `
    <th class="${c.sortable ? '' : 'no-sort'}" data-key="${c.key}">${c.label} ${c.sortable ? '↕' : ''}</th>
  `).join('');
  document.querySelectorAll('th[data-key]').forEach(th => {
    if (th.classList.contains('no-sort')) return;
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'asc'; }
      renderAll();
    });
  });
}

function gaugeHTML(p) {
  const meta = STATUS_META[p.status];
  const pct = Math.max(0, Math.min(100, (p.elapsed / Math.max(p.totalWindow, 1)) * 100));
  const labelText = p.daysToDue < 0 ? `${Math.abs(p.daysToDue)}d overdue` : p.daysToDue === 0 ? 'due today' : `${p.daysToDue}d remaining`;
  const marker = p.status !== 'overdue' ? `<div class="gauge-marker" style="left:${pct}%"></div>` : '';
  return `
    <div class="gauge-wrap">
      <div class="gauge-track">
        <div class="gauge-fill" style="width:${pct}%;background:${meta.color}"></div>
        ${marker}
      </div>
      <span class="gauge-label" style="color:${meta.color}">${labelText}</span>
    </div>`;
}

function renderRows() {
  let rows = POS.filter(p => {
    const q = state.query.toLowerCase();
    const matchesQuery = !q || p.po.toLowerCase().includes(q) || p.supplier.toLowerCase().includes(q) || p.part.toLowerCase().includes(q);
    const matchesStatus = state.statusFilter === 'all' || p.status === state.statusFilter;
    return matchesQuery && matchesStatus;
  });
  rows.sort((a, b) => {
    let av = a[state.sortKey], bv = b[state.sortKey];
    if (av instanceof Date) { av = av.getTime(); bv = bv.getTime(); }
    if (typeof av === 'string') return state.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return state.sortDir === 'asc' ? av - bv : bv - av;
  });

  const tbody = document.getElementById('tbody');
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No purchase orders match this filter.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((p, i) => {
    const meta = STATUS_META[p.status];
    return `
      <tr class="${i % 2 === 0 ? 'row-even' : 'row-odd'}" style="border-left:3px solid ${meta.color}">
        <td class="mono" style="color:var(--steel-bright);white-space:nowrap">${p.po}</td>
        <td>${p.supplier}</td>
        <td style="color:var(--text-muted)">${p.part}</td>
        <td class="mono" style="color:var(--text-muted);white-space:nowrap">${fmt(p.dueDate)}</td>
        <td>${gaugeHTML(p)}</td>
        <td class="mono" style="white-space:nowrap">$${p.value.toLocaleString()}</td>
      </tr>`;
  }).join('');
}

function renderAll() {
  renderKPIs();
  renderPills();
  renderRows();
}

document.getElementById('search').addEventListener('input', (e) => { state.query = e.target.value; renderAll(); });

renderHead();
renderAll();
</script>
</body>
</html>
